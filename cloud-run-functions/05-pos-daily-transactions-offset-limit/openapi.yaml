swagger: "2.0"
info:
  title: POS daily transactions API (v3)
  description: >
    Establishment-scoped POS daily transaction rows. Fronted by API Gateway;
    backend is an HTTP Cloud Function that pages with SQL LIMIT/OFFSET and
    parameterized establishment filters.
  version: "1.0.0"
schemes:
  - https
tags:
  - name: dashboard
    description: Panel / dashboard POS reads
paths:
  /v3/getPOS:
    get:
      tags:
        - dashboard
      summary: POS daily transactions (v3)
      description: >
        Returns a {records} envelope for one establishment, newest
        pos_order_date first. Pagination is applied in BigQuery.
      operationId: getPosV3
      x-google-backend:
        # Gen2 / Cloud Run URI for the panel-pos-v3 function.
        address: https://BACKEND_URL
        protocol: h2
        deadline: 45.0
      security:
        - ApiKeyAuth: []
      produces:
        - application/json
      parameters:
        - name: establishmentId
          in: query
          description: Establishment identifier
          required: true
          type: string
        - name: offset
          in: query
          description: Rows to skip before collecting the result set
          required: false
          type: integer
          minimum: 0
          default: 0
        - name: limit
          in: query
          description: Max rows to return (hard cap 100)
          required: false
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: "#/definitions/PosDailyTxResponse"
        "400":
          description: Bad request — missing establishmentId or invalid paging
        "401":
          description: Unauthorized — authentication missing or invalid
        "403":
          description: Forbidden — edge API key / invoker IAM
        "404":
          description: Establishment not found (empty page)
        "405":
          description: Method not allowed
        "500":
          description: Internal server error
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    name: X-API-Key
    in: header
    description: Edge API key. Prefer API & Services restrictions; never commit real values.
definitions:
  PosDailyTxResponse:
    type: object
    required:
      - records
    properties:
      records:
        type: array
        description: Daily transaction rows for the establishment
        items:
          $ref: "#/definitions/PosDailyTxRow"
  PosDailyTxRow:
    type: object
    properties:
      country:
        type: string
      persistence_id:
        type: string
      establishment_id:
        type: string
      pos_order_date:
        type: string
        description: ISO date string (YYYY-MM-DD) or null
      total_completed_orders:
        type: integer
      total_order_amount:
        type: number
  ErrorResponse:
    type: object
    required:
      - error
      - description
    properties:
      error:
        type: integer
      description:
        type: string
      detail:
        type: string
        description: Present only when EXPOSE_ERROR_DETAIL is enabled
      exceptionType:
        type: string
