swagger: "2.0"
info:
  title: "Vendor lookup API (sanitized example)"
  description: >-
    Edge OpenAPI for a multi-route vendor integration API fronting a Cloud Run /
    Cloud Function backend. Application-layer key checks still run in the handler.
  version: "1.0.0"
schemes:
  - "https"
paths:
  /getUser:
    get:
      operationId: getUserByAccountId
      summary: Retrieve users by account_id
      x-google-backend:
        address: "https://BACKEND_URL/getUser"
        protocol: "h2"
      security:
        - ApiKeyHeader: []
      produces:
        - "application/json"
      parameters:
        - name: account_id
          in: query
          required: true
          type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not found
  /getPosUser:
    get:
      operationId: getPosUserByEnterpriseAndCountry
      summary: Retrieve POS users by enterprise_id + country_code
      x-google-backend:
        address: "https://BACKEND_URL/getPosUser"
        protocol: "h2"
      security:
        - ApiKeyHeader: []
      produces:
        - "application/json"
      parameters:
        - name: enterprise_id
          in: query
          required: true
          type: string
        - name: country_code
          in: query
          required: true
          type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not found
  /getEstablishments:
    get:
      operationId: getEstablishmentById
      summary: Retrieve establishment by establishment_id
      x-google-backend:
        address: "https://BACKEND_URL/getEstablishments"
        protocol: "h2"
      security:
        - ApiKeyHeader: []
      produces:
        - "application/json"
      parameters:
        - name: establishment_id
          in: query
          required: true
          type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not found
securityDefinitions:
  ApiKeyHeader:
    type: apiKey
    name: X-Api-Key
    in: header
    description: Shared integration key. Prefer Secret Manager; never commit real values.
